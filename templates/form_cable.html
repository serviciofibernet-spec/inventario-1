{% extends 'base.html' %}
{% block content %}
<h2>Nuevo Cable</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input name="nombre" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Ubicación origen</label>
    <input name="from_ubicacion" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Ubicación destino</label>
    <input name="to_ubicacion" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Número de fibras</label>
    <input type="number" name="fibras" class="form-control" min="1" required>
  </div>
  <button class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
