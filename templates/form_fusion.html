{% extends 'base.html' %}
{% block content %}
<h2>Nueva Fusión</h2>
<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <input name="descripcion" class="form-control" required>
  </div>
  <div class="row">
    <div class="col-md-6">
      <h5>Origen</h5>
      <div class="mb-2">
        <label class="form-label">Tipo</label>
        <select name="elemento_origen_tipo" class="form-select" required>
          <option value="">Seleccione</option>
          <option value="olt">OLT</option>
          <option value="odf">ODF</option>
          <option value="cable">Cable</option>
          <option value="manga">Manga</option>
          <option value="splitter">Splitter</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">Elemento</label>
        <input name="elemento_origen_id" class="form-control" placeholder="ID" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Fibra (opcional)</label>
        <input type="number" name="fibra_origen" class="form-control" min="1">
      </div>
    </div>
    <div class="col-md-6">
      <h5>Destino</h5>
      <div class="mb-2">
        <label class="form-label">Tipo</label>
        <select name="elemento_destino_tipo" class="form-select" required>
          <option value="">Seleccione</option>
          <option value="olt">OLT</option>
          <option value="odf">ODF</option>
          <option value="cable">Cable</option>
          <option value="manga">Manga</option>
          <option value="splitter">Splitter</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">Elemento</label>
        <input name="elemento_destino_id" class="form-control" placeholder="ID" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Fibra (opcional)</label>
        <input type="number" name="fibra_destino" class="form-control" min="1">
      </div>
    </div>
  </div>
  <button class="btn btn-primary mt-3">Guardar</button>
</form>
{% endblock %}
