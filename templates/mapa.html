{% extends 'base.html' %}
{% block content %}
<h2>Mapa FTTH</h2>
<div class="row">
  <div class="col-md-9">
    <div id="map" style="height: 75vh; border:1px solid #ddd;"></div>
  </div>
  <div class="col-md-3">
    <div class="card mb-3">
      <div class="card-header">Herramientas</div>
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label">Tipo de elemento</label>
          <select id="feature-type" class="form-select">
            <option value="cable">Cable (LineString)</option>
            <option value="manga">Manga (Point)</option>
            <option value="terminal">Terminal (Point)</option>
            <option value="cabina">Cabina (Point)</option>
          </select>
        </div>
        <button id="save-geometry" class="btn btn-primary w-100 mb-2">Guardar geometría</button>
        <button id="reload" class="btn btn-outline-secondary w-100">Recargar</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header">Leyenda</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item"><span style="display:inline-block;width:18px;height:0;border-top:3px solid #0d6efd;vertical-align:middle;margin-right:6px;"></span>Cable</li>
        <li class="list-group-item"><img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" style="width:12px;margin-right:6px;"/>Manga</li>
        <li class="list-group-item"><img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" style="width:12px;margin-right:6px;filter:hue-rotate(120deg);"/>Terminal</li>
        <li class="list-group-item"><img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" style="width:12px;margin-right:6px;filter:hue-rotate(240deg);"/>Cabina</li>
      </ul>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
(function(){
  const center = {{ center|tojson }};
  const map = L.map('map').setView([center.lat, center.lng], center.zoom);

  // Gratis: OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Estilos por tipo
  function styleFor(feature){
    const tipo = feature.properties && feature.properties.tipo;
    if((feature.geometry && feature.geometry.type === 'LineString') || tipo === 'cable'){
      // draw cable with gradient-like dashes to hint fibers
      return {color:'#0d6efd', weight:4, dashArray:'6,6'};
    }
    return {};
  }

  const drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  let drawControl = new L.Control.Draw({
    position: 'topleft',
    draw: {
      polyline: true,
      polygon: false,
      rectangle: false,
      circle: false,
      circlemarker: false,
      marker: true
    },
    edit: { featureGroup: drawnItems, edit: true, remove: false }
  });
  map.addControl(drawControl);

  // Cargar existentes
  async function loadFeatures(){
    const res = await fetch('/api/features');
    const fc = await res.json();
    const layer = L.geoJSON(fc, {
      style: styleFor,
      pointToLayer: function(feature, latlng){
        const tipo = feature.properties && feature.properties.tipo;
        let iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png';
        if (tipo === 'manga') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png';
        if (tipo === 'terminal') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png';
        if (tipo === 'cabina') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png';
        const icon = new L.Icon({
          iconUrl,
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });
        const marker = L.marker(latlng, { icon });
        if (tipo === 'manga'){
          marker.bindPopup('<b>Manga</b><br/><a href="/mangas">Ir a listado</a>');
        }
        return marker;
      }
    }).addTo(map);
    layer.eachLayer(function(l){
      const f = l.feature || {};
      const p = f.properties || {};
      if (p.tipo === 'cable'){
        l.bindTooltip((p.nombre || 'Cable') + (p.fibras? (' · '+p.fibras+' hilos') : ''), {sticky:true});
      }
    });
  }

  loadFeatures();

  document.getElementById('reload').addEventListener('click', ()=>{
    location.reload();
  });

  let lastDrawn = null;
  let lastDrawnType = null;
  map.on(L.Draw.Event.CREATED, function (e) {
    const layer = e.layer;
    drawnItems.clearLayers();
    drawnItems.addLayer(layer);
    lastDrawn = layer;
    lastDrawnType = e.layerType; // polyline or marker
  });

  // Modal to collect cable meta
  function openCableModal(defaultName){
    const name = prompt('Nombre del cable:', defaultName || 'Cable');
    if(!name) return null;
    let fibras = prompt('Numero de hilos (4,6,12,24,48,96):', '12');
    if(!fibras) return null;
    fibras = parseInt(fibras, 10);
    if(![4,6,12,24,48,96].includes(fibras)){
      alert('Cantidad invalida');
      return null;
    }
    return { nombre: name, fibras };
  }

  async function saveGeometry(){
    if(!lastDrawn){ alert('Dibuje un elemento primero'); return; }
    const tipo = document.getElementById('feature-type').value;
    let geojson = lastDrawn.toGeoJSON();
    // normalizar types
    if (geojson.geometry.type === 'Point' && tipo === 'cable'){
      alert('Cable debe ser LineString'); return;
    }
    if (geojson.geometry.type === 'LineString' && tipo !== 'cable'){
      alert('Solo cable es LineString'); return;
    }
    // enrich properties: for cable ask name and fibers
    let props = Object.assign({}, geojson.properties || {}, { tipo });
    if (tipo === 'cable'){
      const meta = openCableModal();
      if(!meta) return;
      props.nombre = meta.nombre;
      props.fibras = meta.fibras;
      // Precompute buffer/fiber colors for 96 fibers
      const base12 = ['azul','naranja','verde','cafe','gris','blanco','rojo','negro','amarillo','violeta','rosa','aqua'];
      // Note: 'violeta' used for 10th as standard; can adjust per requirement
      if (meta.fibras === 96){
        const buffers = [];
        const bufferColors = ['azul','naranja','verde','cafe','gris','blanco','rojo','negro'];
        for(let b=0; b<8; b++){
          const fibers = [];
          for(let i=0;i<12;i++) fibers.push(base12[i]);
          buffers.push({ buffer: b+1, color: bufferColors[b], fibers });
        }
        props.buffers = buffers;
      } else if ([12,24,48].includes(meta.fibras)){
        props.fiber_colors = [];
        const repeat = meta.fibras/12;
        const base12 = ['azul','naranja','verde','cafe','gris','blanco','rojo','negro','amarillo','violeta','rosa','aqua'];
        for(let r=0;r<repeat;r++) props.fiber_colors = props.fiber_colors.concat(base12);
      } else if ([4,6].includes(meta.fibras)){
        const base = ['azul','naranja','verde','cafe','gris','blanco'];
        props.fiber_colors = base.slice(0, meta.fibras);
      }
    }
    geojson.properties = props;
    const res = await fetch('/api/features', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(geojson)});
    if(res.ok){
      alert('Guardado');
      location.reload();
    } else {
      const t = await res.text();
      alert('Error: '+t);
    }
  }

  document.getElementById('save-geometry').addEventListener('click', saveGeometry);
})();
</script>
<style>
.terminal-icon { filter: hue-rotate(120deg); }
.cabina-icon { filter: hue-rotate(240deg); }
</style>
{% endblock %}
